<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Morning Brief</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0E0B08}
body{color:#F0E8DC;font-family:-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#1C1815}::-webkit-scrollbar-thumb{background:#3A2E24;border-radius:2px}
.dash{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR - Option B: same bg as page */
.sb{width:220px;background:#13100E;border-right:1px solid #2A2018;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid #2A2018}
.sb-brand{font-size:14px;font-weight:700;color:#F0E8DC;letter-spacing:-0.01em}
.sb-tagline{font-size:11px;color:#4A3E34;margin-top:3px}
.sb-nav{padding:10px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 18px;cursor:pointer;color:#5A4E42;font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all .12s;user-select:none}
.nav-item:hover{color:#C8BAA8;background:rgba(255,255,255,0.02)}
.nav-item.active{color:#E8781A;background:rgba(232,120,26,0.08);border-left-color:#E8781A}
.nav-item i{font-size:16px;flex-shrink:0}
.sb-footer{padding:14px 18px;border-top:1px solid #2A2018;font-size:11px;color:#3A2E24}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:#0E0B08}
.topbar{padding:14px 24px;border-bottom:1px solid #2A2018;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#13100E;position:sticky;top:0;z-index:10}
.topbar-date{font-size:13px;font-weight:600;color:#F0E8DC}
.topbar-upd{font-size:11px;color:#4A3E34;margin-top:2px}
.refresh-btn{display:flex;align-items:center;gap:6px;background:#E8781A;color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.refresh-btn:hover{background:#C45E0D}
.refresh-btn:disabled{background:#2A2018;color:#4A3E34;cursor:not-allowed}
.content{padding:22px 24px;flex:1}
/* GRIDS */
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.g2w{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
/* CARDS - more breathing room, softer radius */
.card{background:#1C1815;border-radius:12px;border:1px solid #2A2018;padding:18px 20px}
/* SECTION HEADERS - typographic */
.ch{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#E8781A;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.ch i{font-size:13px}
/* OPENING - editorial, larger */
.opening{font-size:17px;color:#6B5E50;font-style:italic;line-height:1.7;margin-bottom:22px}
/* WEATHER */
.wx-main{font-size:18px;font-weight:700;color:#F0E8DC;margin-bottom:4px}
.wx-note{font-size:12px;color:#8A7D6E;line-height:1.5;margin-bottom:12px}
.wx-periods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.wx-period{background:#231E1A;border-radius:7px;padding:9px 6px;text-align:center}
.wx-period-lbl{font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#5A4E42;margin-bottom:3px}
.wx-period-temp{font-size:18px;font-weight:700;color:#F0E8DC}
.wx-period-desc{font-size:10px;color:#8A7D6E;margin-top:2px;line-height:1.3}
.wx-forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid #2A2018;padding-top:11px}
.wx-day{text-align:center}
.wx-day-lbl{font-size:10px;font-weight:600;color:#5A4E42;margin-bottom:3px}
.wx-day-hi{font-size:13px;font-weight:600;color:#C8BAA8}
.wx-day-lo{font-size:11px;color:#5A4E42}
.wx-day-desc{font-size:10px;color:#6B5E50;margin-top:2px}
/* MARKETS */
.mkt-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #2A2018;font-size:13px}
.mkt-row:last-child{border-bottom:none}
.mkt-name{color:#8A7D6E;font-size:12px}
.mkt-val{font-weight:600}
.mkt-chg{font-size:11px;font-weight:600;margin-left:5px}
.up{color:#4CAF7D}.dn{color:#C0451A}.fl{color:#5A4E42}
.mkt-insight{font-size:11.5px;color:#6B5E50;margin-top:10px;padding-top:10px;border-top:1px solid #2A2018;line-height:1.5}
/* PORTFOLIO */
.pfol-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #2A2018}
.pfol-row:last-child{border-bottom:none}
.pfol-badge{font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:3px;flex-shrink:0;letter-spacing:0.03em}
.pf-fund{background:#1A2E44;color:#4A8ABE}
.pf-etf{background:#1A2A1A;color:#4A9A4A}
.pf-stock{background:#2A1A2E;color:#9A4A9A}
.pfol-name{flex:1;font-size:12px;color:#C8BAA8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfol-chg-val{font-size:11.5px;font-weight:600;min-width:52px;text-align:right}
/* ARSENAL */
.afc-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.afc-badge{background:#DC2626;color:#fff;font-size:9px;font-weight:800;padding:3px 7px;border-radius:4px;letter-spacing:0.05em}
.afc-title{font-size:12px;font-weight:600;color:#C8BAA8}
.afc-section-lbl{font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5A4E42;margin-bottom:7px}
.result-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #2A2018;font-size:12px}
.result-row:last-child{border-bottom:none}
.result-badge{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0}
.r-w{background:#1A3A1A;color:#4CAF7D}.r-d{background:#2A2A1A;color:#C49A3C}.r-l{background:#3A1A1A;color:#C0451A}
.result-opp{flex:1;color:#C8BAA8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-score{font-weight:700;color:#F0E8DC;flex-shrink:0;min-width:58px;font-size:11px}
.result-comp{font-size:9.5px;color:#5A4E42;flex-shrink:0}
.afc-divider{border:none;border-top:1px solid #2A2018;margin:9px 0}
.fixture-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #2A2018;font-size:12px}
.fixture-row:last-child{border-bottom:none}
.fixture-ha{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}
.fx-h{background:#1A2A1A;color:#4A8A4A}.fx-a{background:#2A1A1A;color:#8A4A4A}
.fixture-opp{flex:1;color:#C8BAA8;font-weight:500}
.fixture-meta{font-size:10px;color:#5A4E42;text-align:right;flex-shrink:0}
/* COUNTDOWN */
.cd-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2A2018}
.cd-item:last-child{border-bottom:none}
.cd-name{font-size:13px;color:#C8BAA8;font-weight:500}
.cd-sub{font-size:10.5px;color:#5A4E42;margin-top:2px}
.cd-days{font-size:22px;font-weight:700;color:#E8781A;min-width:44px;text-align:right}
.cd-unit{font-size:9px;color:#5A4E42;text-align:right;margin-top:1px}
.cd-empty{font-size:13px;color:#4A3E34;font-style:italic;padding:6px 0}
.cd-link{font-size:11px;color:#E8781A;cursor:pointer;margin-top:9px;display:inline-block}
/* STORY */
.sotd-hl{font-size:16px;font-weight:700;color:#F0E8DC;margin-bottom:8px;line-height:1.45}
.sotd-body{font-size:13px;color:#A89880;line-height:1.7}
/* NEWS */
.nb{list-style:none}
.nb li{font-size:13px;color:#C8BAA8;padding:6px 0 6px 13px;border-bottom:1px solid #2A2018;position:relative;line-height:1.55}
.nb li:last-child{border-bottom:none}
.nb li::before{content:"–";position:absolute;left:0;color:#4A3E34}
.news-topic-hd{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px}
/* TODO */
.todo-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #2A2018}
.todo-item:last-child{border-bottom:none}
.cb{width:17px;height:17px;border:1.5px solid #3A2E24;border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.cb.on{background:#E8781A;border-color:#E8781A}
.tt{flex:1;font-size:13px;color:#C8BAA8}
.tt.done{text-decoration:line-through;color:#4A3E34}
.tdel{opacity:0;background:none;border:none;cursor:pointer;color:#3A2E24;font-size:14px;line-height:1;padding:0 2px}
.todo-item:hover .tdel{opacity:1}
.tdel:hover{color:#C0451A}
.t-add{display:flex;gap:8px;margin-top:12px}
.t-input{flex:1;background:#231E1A;border:1px solid #3A2E24;border-radius:6px;padding:8px 11px;font-size:13px;color:#F0E8DC;font-family:inherit;outline:none;transition:border-color .12s}
.t-input:focus{border-color:#E8781A}
.t-input::placeholder{color:#3A2E24}
.t-btn{background:#E8781A;color:#fff;border:none;border-radius:6px;padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.t-btn:hover{background:#C45E0D}
.clr-btn{margin-top:8px;background:none;border:1px solid #2A2018;border-radius:6px;padding:4px 10px;font-size:11px;color:#5A4E42;cursor:pointer;font-family:inherit}
.t-empty{font-size:13px;color:#3A2E24;font-style:italic;padding:8px 0}
/* READING */
.genre-header{display:flex;align-items:center;gap:10px;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid #2A2018}
.genre-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.genre-label{font-size:13px;font-weight:700;color:#F0E8DC}
.rec-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #2A2018}
.rec-item:last-child{border-bottom:none}
.rec-tag{flex-shrink:0;font-size:8.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 7px;border-radius:4px;color:#fff;margin-top:2px;white-space:nowrap}
.rt-p{background:#2D6A4F}.rt-y{background:#8B0000}.rt-r{background:#1A2A4A}.rt-w{background:#5B3080}
.rec-title{font-size:13px;font-weight:600;color:#F0E8DC;margin-bottom:3px;line-height:1.4}
.rec-why{font-size:12px;color:#8A7D6E;line-height:1.5;margin-bottom:3px}
.rec-meta{font-size:10.5px;color:#4A3E34}
/* RECIPE */
.recipe-tag{display:inline-block;background:#1A2A1A;color:#4CAF7D;font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-bottom:10px;border:1px solid #2D6A4F}
.recipe-name{font-size:15px;font-weight:700;color:#F0E8DC;margin-bottom:5px;line-height:1.4}
.recipe-desc{font-size:12px;color:#8A7D6E;margin-bottom:9px;line-height:1.5}
.recipe-link{display:inline-flex;align-items:center;gap:5px;background:#2D6A4F;color:#E8F5E8;text-decoration:none;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:600;border:1px solid #3A8A60}
.recipe-link:hover{background:#245A40}
/* SETTINGS */
.settings-section{margin-bottom:24px;max-width:520px}
.settings-lbl{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#8A7D6E;margin-bottom:8px}
.settings-input{width:100%;background:#231E1A;border:1px solid #3A2E24;border-radius:7px;padding:9px 12px;font-size:13px;color:#F0E8DC;font-family:inherit;outline:none;transition:border-color .12s}
.settings-input:focus{border-color:#E8781A}
.settings-input::placeholder{color:#3A2E24}
.settings-btn{background:#E8781A;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.settings-btn:hover{background:#C45E0D}
.settings-note{font-size:11.5px;color:#5A4E42;margin-top:5px;line-height:1.6}
.settings-success{font-size:12px;color:#4CAF7D;margin-top:6px}
.settings-divider{border:none;border-top:1px solid #2A2018;margin:20px 0}
.api-note{background:#231E1A;border:1px solid #3A2E24;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.api-note-title{font-size:12px;font-weight:600;color:#C49A3C;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.api-note-text{font-size:11.5px;color:#8A7D6E;line-height:1.6}
.cd-event-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2A2018}
.cd-event-row:last-child{border-bottom:none}
.cd-event-name{flex:1;font-size:13px;color:#C8BAA8}
.cd-event-date{font-size:11px;color:#8A7D6E}
.cd-event-days{font-size:12px;color:#E8781A;font-weight:600;min-width:64px;text-align:right}
.cd-event-del{background:none;border:none;cursor:pointer;color:#3A2E24;font-size:16px;line-height:1;padding:0 3px}
.cd-event-del:hover{color:#C0451A}
/* SITUATIONS */
.sit-item{background:#231E1A;border-radius:8px;border:1px solid #2A2018;padding:12px 14px;margin-bottom:8px}
.sit-item:last-child{margin-bottom:0}
.sit-topic{font-size:9.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#C49A3C;margin-bottom:5px}
.sit-text{font-size:12.5px;color:#A89880;line-height:1.6}
/* QUICK HITS */
.qh{list-style:none}
.qh li{font-size:13px;color:#A89880;padding:6px 0 6px 16px;border-bottom:1px solid #2A2018;position:relative;line-height:1.5}
.qh li:last-child{border-bottom:none}
.qh li::before{content:">";position:absolute;left:0;color:#E8781A;font-weight:600}
.signoff{text-align:center;font-size:11px;color:#3A2E24;font-style:italic;padding:16px 0 8px}
@media(max-width:900px){.g3{grid-template-columns:1fr 1fr}.g2w{grid-template-columns:1fr}}
@media(max-width:640px){.sb{display:none}.g3,.g2,.g2w{grid-template-columns:1fr}}
</style>

        React.createElement("div",{className:"api-note-title"},React.createElement("i",{className:"ti ti-lock",style:{fontSize:14}}),"Browser-only"),
        React.createElement("div",{className:"api-note-text"},"Saves to your browser\u2019s local storage. Never goes in your GitHub repo.")
      ),
      React.createElement("p",{className:"settings-note",style:{marginBottom:8}},savedKey?"\u2713 Key saved \u2014 Refresh button is active.":"Enter your key to enable live refresh. Get one at console.anthropic.com."),
      React.createElement("form",{onSubmit:submitKey},
        React.createElement("input",{className:"settings-input",type:"password",value:key,onChange:e=>setKey(e.target.value),placeholder:"sk-ant-..."}),
        React.createElement("button",{type:"submit",className:"settings-btn"},"Save key"),
        ks&&React.createElement("div",{className:"settings-success"},"\u2713 Saved")
      )
    ),
    React.createElement("hr",{className:"settings-divider"}),
    React.createElement("div",{className:"settings-section"},
      React.createElement("div",{className:"settings-lbl"},"Countdown events"),
      React.createElement("p",{className:"settings-note",style:{marginBottom:12}},"Add birthdays, holidays, or any dates you want to count down to on the home screen."),
      sorted.length>0&&React.createElement("div",{className:"card",style:{marginBottom:14}},
        sorted.map(c=>React.createElement("div",{key:c.id,className:"cd-event-row"},
          React.createElement("div",{style:{flex:1}},
            React.createElement("div",{className:"cd-event-name"},c.name),
            React.createElement("div",{className:"cd-event-date"},fmtDate(c.date))
          ),
          React.createElement("div",{className:"cd-event-days"},c.days>=0?c.days+" days":"past"),
          React.createElement("button",{className:"cd-event-del",onClick:()=>onDeleteCountdown(c.id)},"\u00d7")
        ))
      ),
      React.createElement("form",{onSubmit:submitEvt},
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr auto",gap:8,marginBottom:8}},
          React.createElement("input",{className:"settings-input",value:name,onChange:e=>setName(e.target.value),placeholder:"Event name (e.g. Dubai holiday)"}),
          React.createElement("input",{className:"settings-input",type:"date",value:date,onChange:e=>setDate(e.target.value),style:{width:160}})
        ),
        React.createElement("button",{type:"submit",className:"settings-btn"},"Add event")
      )
    ),
    React.createElement("hr",{className:"settings-divider"}),
    React.createElement("div",{className:"settings-section"},
      React.createElement("div",{className:"settings-lbl"},"Planned"),
      React.createElement("ul",{style:{listStyle:"none",display:"flex",flexDirection:"column",gap:8}},
        ["Custom news topics","Portfolio alert thresholds","Recipe category filters","Morning refresh schedule"].map((item,i)=>
          React.createElement("li",{key:i,style:{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#8A7D6E"}},
            React.createElement("i",{className:"ti ti-circle-dot",style:{color:"#E8781A",fontSize:14}}),
            item
          )
        )
      )
    )
  );
}

function App(){
  const[view,setView]=useState("home");
  const[data,setData]=useState(DEMO);
  const[lastUpd,setLastUpd]=useState(null);
  const[refreshing,setRefreshing]=useState(false);
  const[todos,setTodos]=useState([]);
  const[apiKey,setApiKey]=useState("");
  const[countdowns,setCountdowns]=useState([]);

  useEffect(()=>{(async()=>{
    try{
      const rs=await Promise.allSettled([store.get("morning-data"),store.get("morning-last-updated"),store.get("morning-todos"),store.get("morning-api-key"),store.get("morning-countdowns")]);
      const[d,lu,t,k,cd]=rs;
      if(d.status==="fulfilled"&&d.value)setData(JSON.parse(d.value.value));
      if(lu.status==="fulfilled"&&lu.value)setLastUpd(lu.value.value);
      if(t.status==="fulfilled"&&t.value)setTodos(JSON.parse(t.value.value));
      if(k.status==="fulfilled"&&k.value)setApiKey(k.value.value);
      if(cd.status==="fulfilled"&&cd.value)setCountdowns(JSON.parse(cd.value.value));
    }catch(e){}
  })();},[]);

  async function saveTodos(t){setTodos(t);try{await store.set("morning-todos",JSON.stringify(t));}catch(e){}}
  const addTodo=useCallback(async tx=>{await saveTodos([...todos,{id:Date.now()+"",text:tx,done:false,created:new Date().toISOString()}]);},[todos]);
  const toggleTodo=useCallback(async id=>{await saveTodos(todos.map(t=>t.id===id?{...t,done:!t.done}:t));},[todos]);
  const deleteTodo=useCallback(async id=>{await saveTodos(todos.filter(t=>t.id!==id));},[todos]);
  const clearCompleted=useCallback(async()=>{await saveTodos(todos.filter(t=>!t.done));},[todos]);

  async function saveCDs(cd){setCountdowns(cd);try{await store.set("morning-countdowns",JSON.stringify(cd));}catch(e){}}
  const addCD=useCallback(async e=>{await saveCDs([...countdowns,e]);},[countdowns]);
  const delCD=useCallback(async id=>{await saveCDs(countdowns.filter(c=>c.id!==id));},[countdowns]);
  async function saveKey(k){setApiKey(k);try{await store.set("morning-api-key",k);}catch(e){}}

  async function refresh(){
    if(!apiKey){alert("Add your Anthropic API key in Settings first.");setView("settings");return;}
    setRefreshing(true);
    try{
      const today=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      const SYS=`You are a personal briefing assistant. Today is ${today}. Search for current UK/London data. Return ONLY valid JSON, no markdown. Required structure: {"opening":"string","weather":{"conditions":"string","high":number,"low":number,"note":"string","periods":{"morning":{"temp":number,"desc":"string"},"afternoon":{"temp":number,"desc":"string"},"evening":{"temp":number,"desc":"string"}},"forecast":[{"day":"string","high":number,"low":number,"desc":"string"}]},"markets":{"indices":[{"name":"string","value":"string","change":"string","up":boolean}],"portfolioChanges":{"META":{"daily":"string","dailyUp":boolean,"monthly":"string","monthlyUp":boolean},"GOOGL":{"daily":"string","dailyUp":boolean,"monthly":"string","monthlyUp":boolean}},"insight":"string","situations":[{"topic":"string","update":"string"}]},"arsenal":{"lastResults":[{"opponent":"string","home":boolean,"score":"string","result":"string","competition":"string","date":"string"}],"nextFixtures":[{"opponent":"string","home":boolean,"competition":"string","date":"string"}]},"story":{"headline":"string","body":"string"},"news":[{"topic":"string","color":"string","bullets":["string"]}],"reading":{"sport":[{"type":"string","title":"string","why":"string","meta":"string"}],"techAI":[{"type":"string","title":"string","why":"string","meta":"string"}],"business":[{"type":"string","title":"string","why":"string","meta":"string"}],"culture":[]},"quickHits":["string"]}. Indices: FTSE 100, S&P 500, GBP/USD, Gold, GBP/EUR (no Oil). News topics with colors: AI & Tech (#2A5A8A), Business (#8A6020), Football (#1A5A1A), Cricket (#7A4A2A), Sports Business (#3A2A6A), Sports Headlines (#2A4A6A), London (#2A4A3A). Arsenal: search current results and Premier League fixtures. Portfolio: search META and GOOGL current daily and monthly % changes only. Reading: 2-3 items per genre for sport/techAI/business. 5 quickHits. 3-day forecast.`;
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:5000,tools:[{"type":"web_search_20250305","name":"web_search"}],system:SYS,messages:[{role:"user",content:"Generate my morning brief with current data."}]})
      });
      const rd=await res.json();
      if(rd.error)throw new Error(rd.error.message);
      const tb=rd.content.find(b=>b.type==="text");
      if(tb){
        const clean=tb.text.trim().replace(/^```json\s*/,"").replace(/\s*```\$/,"");
        const nd=JSON.parse(clean);
        const now=new Date().toISOString();
        setData(nd);setLastUpd(now);
        await Promise.allSettled([store.set("morning-data",JSON.stringify(nd)),store.set("morning-last-updated",now)]);
      }
    }catch(e){console.error(e);alert("Refresh failed: "+e.message);}
    finally{setRefreshing(false);}
  }

  const fmtUpd=iso=>{
    if(!iso)return"Showing demo data \u00b7 hit refresh for live content";
    const d=new Date(iso);
    return"Updated "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" \u00b7 "+d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  };
  const todayStr=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  function renderView(){
    switch(view){
      case"home":return React.createElement(HomeView,{data,todos,onAddTodo:addTodo,onToggleTodo:toggleTodo,countdowns,onGoSettings:()=>setView("settings")});
      case"markets":return React.createElement(MarketsView,{data});
      case"news":return React.createElement(NewsView,{data});
      case"todo":return React.createElement(TodoView,{todos,onAddTodo:addTodo,onToggleTodo:toggleTodo,onDeleteTodo:deleteTodo,onClearCompleted:clearCompleted});
      case"reading":return React.createElement(ReadingView,{data});
      case"recipes":return React.createElement(RecipesView,null);
      case"settings":return React.createElement(SettingsView,{onSaveKey:saveKey,savedKey:!!apiKey,countdowns,onAddCountdown:addCD,onDeleteCountdown:delCD});
      default:return null;
    }
  }

  return React.createElement("div",{className:"dash"},
    React.createElement("div",{className:"sb"},
      React.createElement("div",{className:"sb-logo"},
        React.createElement("div",{className:"sb-brand"},"Morning Brief"),
        React.createElement("div",{className:"sb-tagline"},"Personal dashboard")
      ),
      React.createElement("nav",{className:"sb-nav"},
        NAV.map(n=>React.createElement("div",{key:n.id,className:"nav-item"+(view===n.id?" active":""),onClick:()=>setView(n.id)},
          React.createElement("i",{className:"ti "+n.icon}),n.label
        ))
      ),
      React.createElement("div",{className:"sb-footer"},"v3.0")
    ),
    React.createElement("div",{className:"main"},
      React.createElement("div",{className:"topbar"},
        React.createElement("div",null,
          React.createElement("div",{className:"topbar-date"},todayStr),
          React.createElement("div",{className:"topbar-upd"},fmtUpd(lastUpd))
        ),
        React.createElement("button",{className:"refresh-btn",onClick:refresh,disabled:refreshing},
          React.createElement("i",{className:"ti "+(refreshing?"ti-loader-2":"ti-refresh"),style:{fontSize:14}}),
          refreshing?"Refreshing...":"Refresh"
        )
      ),
      React.createElement("div",{className:"content"},renderView())
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>

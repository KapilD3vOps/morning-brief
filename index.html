// Storage adapter — works standalone (localStorage) and in Claude (window.storage)
const store={
  async get(k){
    if(window.storage)return window.storage.get(k);
    const v=localStorage.getItem(k);return v?{value:v}:null;
  },
  async set(k,v){
    if(window.storage)return window.storage.set(k,v);
    localStorage.setItem(k,v);return{key:k,value:v};
  }
};

function todayRecipe(){
  const d=new Date();
  const doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  return RECIPES[doy%RECIPES.length];
}

function CardH({title}){
  return React.createElement('div',{className:'ch'},React.createElement('span',null),title);
}

function MktChg({change,up}){
  const cls=up===true?'up':up===false?'dn':'fl';
  return React.createElement('span',{className:'mkt-chg '+cls},change);
}

function RecTag({type}){
  const cls={PODCAST:'rt-p',YOUTUBE:'rt-y',READ:'rt-r',WATCH:'rt-w'}[type]||'rt-r';
  return React.createElement('span',{className:'rec-tag '+cls},type);
}

  const cls={FUND:'pf-fund',ETF:'pf-etf',STOCK:'pf-stock'}[type]||'pf-fund';
  return React.createElement('span',{className:'pfol-type '+cls},type);

      React.createElement('div',{className:'settings-label'},'Anthropic API key'),

function App(){
  const[view,setView]=useState('home');
  const[data,setData]=useState(DEMO);
  const[lastUpdated,setLastUpdated]=useState(null);
  const[refreshing,setRefreshing]=useState(false);
  const[todos,setTodos]=useState([]);
  const[apiKey,setApiKey]=useState('');

  useEffect(()=>{
    (async()=>{
      try{
        const[d,lu,t,k]=await Promise.allSettled([
          store.get('morning-data'),
          store.get('morning-last-updated'),
          store.get('morning-todos'),
          store.get('morning-api-key')
        ]);
        if(d.status==='fulfilled'&&d.value)setData(JSON.parse(d.value.value));
        if(lu.status==='fulfilled'&&lu.value)setLastUpdated(lu.value.value);
        if(t.status==='fulfilled'&&t.value)setTodos(JSON.parse(t.value.value));
        if(k.status==='fulfilled'&&k.value)setApiKey(k.value.value);
      }catch(e){}
    })();
  },[]);

  async function saveTodos(t){
    setTodos(t);
    try{await store.set('morning-todos',JSON.stringify(t));}catch(e){}
  }

  const addTodo=useCallback(async txt=>{
    const nt=[...todos,{id:Date.now()+'',text:txt,done:false,created:new Date().toISOString()}];
    await saveTodos(nt);
  },[todos]);

  const toggleTodo=useCallback(async id=>{
    await saveTodos(todos.map(t=>t.id===id?{...t,done:!t.done}:t));
  },[todos]);

  const deleteTodo=useCallback(async id=>{
    await saveTodos(todos.filter(t=>t.id!==id));
  },[todos]);

  const clearCompleted=useCallback(async()=>{
    await saveTodos(todos.filter(t=>!t.done));
  },[todos]);

  async function saveKey(k){
    setApiKey(k);
    try{await store.set('morning-api-key',k);}catch(e){}
  }

  async function refresh(){
    if(!apiKey){
      alert('Add your Anthropic API key in Settings first.');
      setView('settings');
      return;
    }
    setRefreshing(true);
    try{
      const today=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({
          model:'claude-sonnet-4-6',max_tokens:4000,
          tools:[{'type':'web_search_20250305','name':'web_search'}],
          system:'You are a personal briefing assistant. Today is '+today+'. Use web search for current UK/London data. Return ONLY valid JSON, no markdown. Structure: {"opening":"string","weather":{"conditions":"string","high":number,"low":number,"note":"string"},"markets":{"indices":[{"name":"string","value":"string","change":"string","up":boolean}],"insight":"string","situations":[{"topic":"string","update":"string"}]},"story":{"headline":"string","body":"string"},"news":[{"topic":"string","bullets":["string"]}],"reading":[{"type":"PODCAST|YOUTUBE|READ|WATCH","title":"string","why":"string","meta":"string"}],"quickHits":["string"]}. Include 6 market indices (FTSE 100, S&P 500, GBP/USD, Gold, Oil Brent, GBP/EUR). News topics: AI & Tech, Business, Football, Cricket, Sports Business, Sports Headlines, London. Situations: Sports Streaming Rights and AI Regulation. 5 reading items mixing formats. 5 quick hits.',
          messages:[{role:'user',content:'Generate my morning brief with current data.'}]
        })
      });
      const rd=await res.json();
      if(rd.error){throw new Error(rd.error.message);}
      const tb=rd.content.find(b=>b.type==='text');
      if(tb){
        const clean=tb.text.trim().replace(/^```json\s*/,'').replace(/\s*```$/,'');
        const nd=JSON.parse(clean);
        const now=new Date().toISOString();
        setData(nd);setLastUpdated(now);
        await Promise.allSettled([
          store.set('morning-data',JSON.stringify(nd)),
          store.set('morning-last-updated',now)
        ]);
      }
    }catch(e){
      console.error('Refresh failed:',e);
      alert('Refresh failed: '+e.message+'. Check your API key in Settings.');
    }finally{setRefreshing(false);}
  }

  const fmtUpd=iso=>{
    if(!iso)return'Never refreshed \u00b7 showing demo data';
    const d=new Date(iso);
    return'Updated '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' \u00b7 '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  };

  const todayStr=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const views={home:HomeView,markets:MarketsView,news:NewsView,todo:TodoView,reading:ReadingView,recipes:RecipesView};

  const renderView=()=>{
    if(view==='settings')return React.createElement(SettingsView,{onSaveKey:saveKey,savedKey:!!apiKey});
    const CV=views[view]||HomeView;
    return React.createElement(CV,{data,todos,onAddTodo:addTodo,onToggleTodo:toggleTodo,onDeleteTodo:deleteTodo,onClearCompleted:clearCompleted});
  };

  return React.createElement('div',{className:'dash'},
    React.createElement('div',{className:'sb'},
      React.createElement('div',{className:'sb-logo'},
        React.createElement('div',{className:'sb-title'},'Morning Brief'),
        React.createElement('div',{className:'sb-sub'},'Personal dashboard')
      ),
      React.createElement('nav',{className:'sb-nav'},
        NAV.map(n=>
          React.createElement('div',{
            key:n.id,
            className:'nav-item'+(view===n.id?' active':''),
            onClick:()=>setView(n.id)
          },
            React.createElement('i',{className:'ti '+n.icon}),
            n.label
          )
        )
      ),
      React.createElement('div',{className:'sb-footer'},'v2.0 \u00b7 github.com')
    ),
    React.createElement('div',{className:'main'},
      React.createElement('div',{className:'topbar'},
        React.createElement('div',null,
          React.createElement('div',{className:'topbar-date'},todayStr),
          React.createElement('div',{className:'topbar-upd'},fmtUpd(lastUpdated))
        ),
        React.createElement('button',{
          className:'refresh-btn',
          onClick:refresh,
          disabled:refreshing
        },
          React.createElement('i',{className:'ti '+(refreshing?'ti-loader-2':'ti-refresh'),style:{fontSize:14}}),
          refreshing?'Refreshing...':'Refresh'
        )
      ),
      React.createElement('div',{className:'content'},renderView())
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
